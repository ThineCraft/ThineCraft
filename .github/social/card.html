<!doctype html>
<!--
  The picture shown when a link to thinecraft.io is shared (Open Graph and X cards).
  It is drawn at exactly 1200 x 630 and saved as docs/social-card.png by
  render.mjs in this folder:  node .github/social/render.mjs
  The words, colour and letter come from docs/index.html; change them there too.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ThineCraft social card</title>
<style>
  :root { --accent: #d9ff6b; --ink: #f5f1e7; --soft: #c6c2b7; --muted: #8f8c84; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 78% 50%, color-mix(in srgb, var(--accent) 17%, transparent), transparent 430px),
      linear-gradient(135deg, #090d12, #0d131a 58%, #090d12);
  }
  body::before {
    position: absolute; inset: 0; content: "";
    background-image: linear-gradient(#ffffff09 1px, transparent 1px), linear-gradient(90deg, #ffffff09 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: linear-gradient(to bottom right, black, transparent 85%);
  }
  .copy { position: absolute; left: 72px; top: 64px; bottom: 60px; width: 600px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .mark { width: 64px; height: 64px; flex: none; }
  .name { font-size: 40px; font-weight: 850; letter-spacing: -.05em; line-height: 1; }
  .by { margin-top: 6px; color: var(--muted); font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .eyebrow { margin: 50px 0 0; color: var(--accent); font-size: 15px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
  h1 { margin: 16px 0 0; font-size: 64px; font-weight: 850; letter-spacing: -.055em; line-height: .98; text-wrap: balance; }
  .foot { display: flex; align-items: center; gap: 14px; margin-top: auto; color: var(--soft); font-size: 19px; font-weight: 600; }
  .foot b { color: var(--accent); font-weight: 800; }
  .foot i { width: 5px; height: 5px; border-radius: 50%; background: #ffffff40; }
  .signal { position: absolute; left: 700px; top: 85px; width: 460px; height: 460px; border: 1px solid #ffffff16; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 16%, transparent), transparent 54%);
    box-shadow: inset 0 0 80px #0008, 0 0 96px color-mix(in srgb, var(--accent) 12%, transparent); }
  .signal::before, .signal::after { position: absolute; inset: 50% auto auto 50%; background: #ffffff18; content: ""; transform: translate(-50%, -50%); }
  .signal::before { width: 1px; height: 100%; }
  .signal::after { width: 100%; height: 1px; }
  .orbit { position: absolute; border: 1px solid color-mix(in srgb, var(--accent) 52%, transparent); border-radius: 50%; }
  .orbit-one { inset: 14%; border-style: dashed; }
  .orbit-two { inset: 29%; }
  .core { position: absolute; z-index: 2; inset: 38%; display: grid; place-items: center; border: 1px solid var(--accent); border-radius: 18px;
    background: #0a1016; box-shadow: 0 0 48px color-mix(in srgb, var(--accent) 28%, transparent); transform: rotate(45deg); }
  .core span { color: var(--accent); font-size: 60px; font-weight: 900; transform: rotate(-45deg); }
  .label { position: absolute; z-index: 3; padding: 7px 11px; border: 1px solid #ffffff24; border-radius: 999px; background: #0a1016e8;
    color: #f4f1e8; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 15px; font-weight: 800; letter-spacing: .14em; }
  .label-1 { top: 8%; left: 50%; transform: translateX(-50%); }
  .label-2 { right: -2%; bottom: 26%; }
  .label-3 { bottom: 8%; left: 5%; }
</style>
</head>
<body>
  <div class="signal" aria-hidden="true">
    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>
    <div class="core"><span>T</span></div>
    <span class="label label-1">OPEN</span><span class="label label-2">PORTABLE</span><span class="label label-3">YOURS</span>
  </div>
  <div class="copy">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0b0f14" stroke="#ffffff22"/><path d="M13 13h38v38H13z" fill="none" stroke="#d9ff6b" stroke-width="3"/><text x="32" y="41" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#f4f1e8">T</text></svg>
      <div><div class="name">ThineCraft</div><div class="by">Open-source tools and infrastructure</div></div>
    </div>
    <p class="eyebrow">Open tools. Independent infrastructure.</p>
    <h1>Your work. Your way. Yours to keep.</h1>
    <div class="foot"><b>thinecraft.io</b><i></i><span>Independent, open source, yours</span></div>
  </div>
</body>
</html>
